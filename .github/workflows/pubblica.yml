# Pubblicazione automatica Oltremappa: gira sui server di GitHub, anche con il PC spento.
name: Pubblica su Instagram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "1 = prepara i contenuti in coda senza pubblicarli"
        default: "0"

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    # fino a 55 minuti di attesa dell'orario esatto, più il tempo di pubblicazione
    timeout-minutes: 90
    steps:
      # ref: main = la coda di quando il giro PARTE. Senza, un giro rimasto in attesa usava la coda di quando era
      # stato creato: il 23/10/2026 alle 16:30 ha ritrovato Socotra appena pubblicato e ha provato a ripubblicarlo
      - uses: actions/checkout@v4
        with:
          ref: main
      # serve al rinnovo settimanale del token (cifra il segreto): installarlo dentro lo script non funzionava
      - name: Installa pynacl
        run: python -m pip install -q pynacl
      - name: Pubblica i contenuti in scadenza
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PROVA: ${{ github.event.inputs.prova }}
        run: python script/pubblica_cloud.py
      # Se nel frattempo il PC ha cambiato la coda, il vecchio «git pull --rebase» andava in conflitto e l'esito
      # si perdeva (22/10/2026): un post uscito restava in coda e poteva uscire due volte. Ora l'esito del giro vince.
      # anche se il passo prima è finito in errore: quello che è uscito va registrato comunque
      - name: Salva l'esito
        if: always()
        run: |
          git config user.name "oltremappa-bot"
          git config user.email "oltremappa@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          esiti=$(git diff --cached --name-only --diff-filter=AM -- fatti errori stato)
          mkdir -p /tmp/esito
          for f in $esiti; do mkdir -p "/tmp/esito/$(dirname "$f")"; cp "$f" "/tmp/esito/$f"; done
          git commit -q -m "esito pubblicazione"
          for tentativo in 1 2 3 4 5; do
            git push && exit 0
            sleep 5
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $esiti; do
              mkdir -p "$(dirname "$f")"; cp "/tmp/esito/$f" "$f"
              case "$f" in fatti/*|errori/*) rm -rf "coda/$(basename "$f" .json)";; esac
            done
            git add -A
            git diff --cached --quiet && exit 0
            git commit -q -m "esito pubblicazione"
          done
          exit 1
