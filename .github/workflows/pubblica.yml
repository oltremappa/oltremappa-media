# Pubblicazione automatica Oltremappa: gira sui server di GitHub, anche con il PC spento.
name: Pubblica su Instagram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "1 = prepara i contenuti in coda senza pubblicarli"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    # fino a 55 minuti di attesa dell'orario esatto, il tempo di pubblicazione e fino a 250 minuti di «sveglia»
    timeout-minutes: 355
    steps:
      # ref: main = la coda di quando il giro PARTE. Senza, un giro rimasto in attesa usava la coda di quando era
      # stato creato: il 23/10/2026 alle 16:30 ha ritrovato Socotra appena pubblicato e ha provato a ripubblicarlo
      - uses: actions/checkout@v4
        with:
          ref: main
      # serve al rinnovo settimanale del token (cifra il segreto): installarlo dentro lo script non funzionava
      - name: Installa pynacl
        run: python -m pip install -q pynacl
      - name: Pubblica i contenuti in scadenza
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PROVA: ${{ github.event.inputs.prova }}
        run: python script/pubblica_cloud.py
      # Se nel frattempo il PC ha cambiato la coda, il vecchio «git pull --rebase» andava in conflitto e l'esito
      # si perdeva (22/10/2026): un post uscito restava in coda e poteva uscire due volte. Ora l'esito del giro vince.
      # anche se il passo prima è finito in errore: quello che è uscito va registrato comunque
      - name: Salva l'esito
        if: always()
        run: |
          git config user.name "oltremappa-bot"
          git config user.email "oltremappa@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          esiti=$(git diff --cached --name-only --diff-filter=AM -- fatti errori stato)
          mkdir -p /tmp/esito
          for f in $esiti; do mkdir -p "/tmp/esito/$(dirname "$f")"; cp "$f" "/tmp/esito/$f"; done
          git commit -q -m "esito pubblicazione"
          for tentativo in 1 2 3 4 5; do
            git push && exit 0
            sleep 5
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $esiti; do
              mkdir -p "$(dirname "$f")"; cp "/tmp/esito/$f" "$f"
              case "$f" in fatti/*|errori/*) rm -rf "coda/$(basename "$f" .json)";; esac
            done
            git add -A
            git diff --cached --quiet && exit 0
            git commit -q -m "esito pubblicazione"
          done
          exit 1
      # «Sveglia» (24/11/2026): dal 21/11 GitHub fa partire i giri programmati solo ogni 6-10 ore e il 23/11 R64 è
      # saltato. Se in coda c'è altro, il giro aspetta fino a 50 minuti prima del prossimo contenuto (al massimo
      # 250 minuti) e poi fa partire da solo un giro nuovo, che lo pubblica all'ora esatta.
      - name: Sveglia per il prossimo contenuto
        if: always() && github.event.inputs.prova != '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git fetch -q origin main && git reset -q --hard origin/main
          python - <<'EOF'
          import datetime as dt, glob, json, subprocess, time
          ora = dt.datetime.now(dt.timezone.utc)
          prossimi = []
          for p in glob.glob("coda/*/post.json"):
              q = dt.datetime.fromisoformat(json.load(open(p, encoding="utf-8"))["quando"])
              if q > ora:
                  prossimi.append(q)
          if not prossimi:
              print("Coda vuota: nessuna sveglia.")
              raise SystemExit(0)
          attesa = max(0, min((min(prossimi) - ora).total_seconds() - 50 * 60, 250 * 60))
          print(f"Prossimo contenuto: {min(prossimi):%d/%m %H:%M} UTC. Sveglia tra {attesa / 60:.0f} minuti.")
          time.sleep(attesa)
          subprocess.run(["gh", "workflow", "run", "pubblica.yml", "--ref", "main", "-R", "oltremappa/oltremappa-media"], check=True)
          EOF
